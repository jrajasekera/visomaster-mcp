[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visomaster-mcp"
version = "0.1.0"
description = "MCP job server for a VisoMaster Fusion GPU workstation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.26,<2"]

[project.scripts]
visomaster-mcp = "visomaster_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
